<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>H5跳一跳</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="score-container">
        <div id="score">0</div>
        <div id="combo-text">连击 x2</div>
    </div>
    <div id="top-actions">
        <button id="audio-toggle" aria-pressed="false">🔊 音效开</button>
    </div>
    <div id="connection-status" aria-live="polite" aria-atomic="true"></div>
    <div id="login-modal">
        <div class="login-box">
            <h2>欢迎来到跳一跳</h2>
            <input type="text" id="nickname-input" placeholder="请输入你的昵称" maxlength="12">
            <div class="login-actions">
                <button id="start-game-btn">开始游戏</button>
                <button id="spectate-btn" class="secondary-btn">查看榜单</button>
            </div>
            <div style="margin-top: 15px;">
                <a href="#" id="enter-streamer-mode" style="color: #667eea; font-size: 14px; text-decoration: none;">进入主播演示模式 (测试互动)</a>
            </div>
        </div>
    </div>
    
    <!-- 复活倒计时 UI -->
    <div id="revive-ui" style="display: none; position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%); text-align: center; z-index: 50; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.5);">
        <h2 style="font-size: 24px; margin-bottom: 10px;">等待复活...</h2>
        <div class="count" style="font-size: 60px; font-weight: bold; color: #ffeb3b;">5</div>
        <p style="font-size: 16px; margin-top: 10px;">送出礼物 🚀 或 ❤️ 复活!</p>
    </div>

    <div id="touch-indicator">长按蓄力 · 松开跳跃</div>
    <div id="power-bar-container">
        <div id="power-bar"></div>
    </div>
    <div id="leaderboard">
        <div class="lb-tabs">
            <button class="lb-tab active" data-target="online">在线排名</button>
            <button class="lb-tab" data-target="history">最高得分</button>
        </div>
        <ul id="leaderboard-list" class="lb-list active">
            <!-- 动态生成在线排名 -->
        </ul>
        <ul id="highscore-list" class="lb-list" style="display:none;">
            <!-- 动态生成历史排名 -->
        </ul>
    </div>
    <div id="game-over">
        <h2>游戏结束</h2>
        <div id="final-score">0</div>
        <button id="restart-btn">再来一次</button>
    </div>
    <div id="guide-overlay">
        <div class="guide-box">
            <h2>快速上手</h2>
            <ol>
                <li>长按屏幕或空格键蓄力，松开即可跳跃。</li>
                <li>尽量落在平台中心，获得连击与高分。</li>
                <li>多人在线：可看到其他玩家影子，排行榜实时更新。</li>
            </ol>
            <div class="guide-actions">
                <button id="guide-close">我知道了</button>
                <button id="guide-never">不再提示</button>
            </div>
        </div>
    </div>
    <!-- 使用 CDN 加载 Socket.io，确保即使本地没有 Socket.io 服务也能加载库 -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- 模块化引入 -->
    <script src="js/core/config.js"></script>
    <script src="js/utils/logger.js"></script>
    <script src="js/utils/math.js"></script>
    <script src="js/core/resource-manager.js"></script>
    <script src="js/core/scene-setup.js"></script>
    <script src="js/ui/ui-manager.js"></script>
    
    <!-- 实体 -->
    <script src="js/entities/character.js"></script>
    <script src="js/entities/audience.js"></script>
    
    <!-- 系统 -->
    <script src="js/systems/audio-manager.js"></script>
    <script src="js/systems/particle-system.js"></script>
    <script src="js/systems/ripple-system.js"></script>
    <script src="js/systems/cloud-system.js"></script>
    <script src="js/systems/network.js"></script>
    <script src="js/systems/streamer-manager.js"></script>
    
    <!-- 主逻辑 -->
    <script src="game.js"></script>
</body>
</html>
