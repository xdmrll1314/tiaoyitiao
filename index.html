<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>H5跳一跳</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="score-container">
        <div id="score">0</div>
        <div id="combo-text">连击 x2</div>
    </div>
    <div id="top-actions">
        <button id="audio-toggle" aria-pressed="false">🔊 音效开</button>
    </div>
    <div id="connection-status" aria-live="polite" aria-atomic="true"></div>
    <div id="login-modal">
        <div class="login-box">
            <h2>欢迎来到跳一跳</h2>
            <input type="text" id="nickname-input" placeholder="请输入你的昵称" maxlength="12">
            <div class="login-actions">
                <button id="start-game-btn">开始游戏</button>
                <button id="spectate-btn" class="secondary-btn">观战模式</button>
            </div>
        </div>
    </div>
    <div id="touch-indicator">长按蓄力 · 松开跳跃</div>
    <div id="power-bar-container">
        <div id="power-bar"></div>
    </div>
    <div id="leaderboard">
        <h3>在线排名</h3>
        <ul id="leaderboard-list">
            <!-- 动态生成 -->
        </ul>
    </div>
    <div id="game-over">
        <h2>游戏结束</h2>
        <div id="final-score">0</div>
        <button id="restart-btn">再来一次</button>
    </div>
    <div id="guide-overlay">
        <div class="guide-box">
            <h2>快速上手</h2>
            <ol>
                <li>长按屏幕或空格键蓄力，松开即可跳跃。</li>
                <li>尽量落在平台中心，获得连击与高分。</li>
                <li>多人在线：可看到其他玩家影子，排行榜实时更新。</li>
            </ol>
            <div class="guide-actions">
                <button id="guide-close">我知道了</button>
                <button id="guide-never">不再提示</button>
            </div>
        </div>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- 模块化引入 -->
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/resource-manager.js"></script>
    <script src="js/audio-manager.js"></script>
    <script src="js/particle-system.js"></script>
    <script src="js/ripple-system.js"></script>
    <script src="js/cloud-system.js"></script>
    <script src="js/character.js"></script>
    <script src="js/network.js"></script>
    <script src="game.js"></script>
</body>
</html>
